  <g class="in" style="animation-delay:250ms"><circle cx="165" cy="88" r="5" fill="#3178c6"/><text x="176" y="92" class="l" style="font-size:12px">TypeScript</text><text x="176" y="105" class="s">27.8%</text></g>
  <g class="in" style="animation-delay:350ms"><circle cx="30" cy="122" r="5" fill="#3572A5"/><text x="41" y="126" class="l" style="font-size:12px">Python</text><text x="41" y="139" class="s">20.4%</text></g>
  <g class="in" style="animation-delay:450ms"><circle cx="165" cy="122" r="5" fill="#663399"/><text x="176" y="126" class="l" style="font-size:12px">CSS</text><text x="176" y="139" class="s">9.0%</text></g>
  <g class="in" style="animation-delay:550ms"><circle cx="30" cy="156" r="5" fill="#41b883"/><text x="41" y="160" class="l" style="font-size:12px">Vue</text><text x="41" y="173" class="s">6.6%</text></g>
