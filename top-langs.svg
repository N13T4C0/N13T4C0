    <rect x="25.00" y="55" width="77.93" height="8" fill="#f1e05a"/>
    <rect x="102.43" y="55" width="70.04" height="8" fill="#3178c6"/>
    <rect x="171.97" y="55" width="51.57" height="8" fill="#3572A5"/>
    <rect x="223.04" y="55" width="22.99" height="8" fill="#663399"/>
    <rect x="245.52" y="55" width="17.03" height="8" fill="#41b883"/>
    <rect x="262.05" y="55" width="13.45" height="8" fill="#e34c26"/>
