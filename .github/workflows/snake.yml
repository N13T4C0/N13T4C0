name: Generate Snake

# Genera la serpiente de contribuciones y las tarjetas de estadísticas
# y las publica en la rama "output".
on:
  schedule: # cada 12 horas
    - cron: "0 */12 * * *"
  push:
    branches: [main]
    paths:
      - "stats/**"
      - ".github/workflows/snake.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00FF41&color_dots=#161b22,#003b12,#00661f,#00a833,#00FF41

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar tarjetas de estadísticas
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python stats/generate.py "${{ github.repository_owner }}" dist

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
